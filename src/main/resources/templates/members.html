<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members | TS Library</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="layout">

    <div th:replace="fragments/sidebar :: sidebar"></div>

    <div class="content">

        <div class="page-header">

            <h1>Members</h1>

            <a th:href="@{/addmembers}" class="add-btn">
                + Add Member
            </a>

            <div class="search-container">
                <input type="text" class="search-input" placeholder="Search members...">
            </div>

        </div>

        <div class="table-container">

            <table>

                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Mobile</th>
                    <th>Address</th>
                    <th>Joined Date</th>
                    <th>Action</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="member : ${members}">

                    <td th:text="${member.id}"></td>

                    <td th:text="${member.name}"></td>

                    <td th:text="${member.email}"></td>

                    <td th:text="${member.mobile}"></td>

                    <td th:text="${member.address}"></td>

                    <td th:text="${member.joinedDate}"></td>

                    <td>
                        <a th:href="@{/deletemember/{id}(id=${member.id})}" class="delete-btn" onclick="return confirm('Delete this member?')">
                            Delete
                        </a>
                    </td>

                </tr>

                </tbody>

            </table>

            <div class="pagination" id="pagination"></div>

        </div>

    </div>
</div>

<script th:src="@{/js/app.js}"></script>

</body>
</html>
