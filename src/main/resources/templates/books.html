<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books | TS Library</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="layout">

    <div th:replace="fragments/sidebar :: sidebar"></div>

    <div class="content">

        <div class="page-header">

            <h1>Books</h1>

            <a th:href="@{/addbooks}" class="add-btn">
                + Add Book
            </a>

            <div class="search-container">
                <input type="text" class="search-input" placeholder="Search books...">
            </div>

        </div>

        <div class="table-container">

            <table>

                <thead>
                <tr>
                    <th>ID</th>
                    <th>Book Name</th>
                    <th>Author</th>
                    <th>Category</th>
                    <th>Published Date</th>
                    <th>Quantity</th>
                    <th>Available</th>
                    <th>Action</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="book : ${books}">

                    <td th:text="${book.id}"></td>

                    <td th:text="${book.title}"></td>

                    <td th:text="${book.author}"></td>

                    <td th:text="${book.category}"></td>

                    <td th:text="${book.publishedDate}"></td>

                    <td th:text="${book.quantity}"></td>

                    <td th:text="${book.availableQuantity}"></td>

                    <td>
                        <div class="action-buttons">
                            <a th:href="@{/deletebook/{id}(id=${book.id})}" class="delete-btn" onclick="return confirm('Delete this book?')">
                                Delete
                            </a>
                        
                            <a th:href="@{/issuebook/{id}(id=${book.id})}" class="issue-btn">
                                Issue
                            </a>
                        </div>
                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<script th:src="@{/js/app.js}"></script>

</body>
</html>
